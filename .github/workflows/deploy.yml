# Deploys the site whenever its branch changes: development is the test site, main is the live site.
# Needs two repository secrets (Settings, Secrets and variables, Actions): CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Optional: ADMIN_PASSWORD, set as the test site's admin password on every deploy.
name: deploy
on:
  push:
    branches: [development, main]
  workflow_dispatch:
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ENV_FLAG: ${{ github.ref_name == 'main' && ' ' || '--env test' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The first deploy also creates the database and photo storage; later deploys keep using them.
      - run: npx wrangler deploy $ENV_FLAG
      - run: npx wrangler d1 migrations apply DB --remote $ENV_FLAG
      - name: Set the test site's admin password
        if: github.ref_name == 'development'
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -n "$ADMIN_PASSWORD" ]; then printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD --env test; fi
