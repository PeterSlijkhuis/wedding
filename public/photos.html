<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wedding</title>
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <header></header>
  <main style="max-width:60rem">
    <h1 data-i18n="page.photos"></h1>
    <div class="gallery" id="gallery"></div>
    <dialog id="viewer"><img id="big" alt=""></dialog>
  </main>
  <script type="module">
    import { init, get, el, t, guestHeader } from "/js/app.js";
    const site = await init();
    await guestHeader(site);
    const viewer = document.getElementById("viewer");
    const big = document.getElementById("big");
    viewer.onclick = () => viewer.close();
    const { photos } = await get("/api/photos");
    document.getElementById("gallery").replaceChildren(...(photos.length
      ? photos.map((id) => el("img", {
          src: `/api/photos/${id}`, loading: "lazy", alt: "",
          onclick: () => { big.src = `/api/photos/${id}`; viewer.showModal(); },
        }))
      : [el("p", { class: "muted" }, t("page.empty"))]));
  </script>
</body>
</html>
