<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <title>Wedding admin</title>
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin" data-mode="dashboard">
  <aside id="panel">
    <div id="editor-top" hidden>
      <button type="button" class="icon-btn" id="menu-open" data-i18n-title="tip.menu">&#9776;</button>
      <strong id="section-title"></strong>
    </div>

    <nav id="drawer" hidden aria-label="Menu">
      <div class="drawer-head">
        <a href="#dashboard" class="drawer-home" id="drawer-home" data-i18n-title="tip.dashboard"><span aria-hidden="true">&#8962;</span> <span data-i18n="admin.dashboard"></span></a>
        <button type="button" class="icon-btn" id="menu-close" data-i18n-title="tip.close">&times;</button>
      </div>
      <h3 data-i18n="admin.group.website"></h3>
      <a href="#details" data-i18n="admin.tile.details" data-i18n-title="tip.tile.details"></a>
      <a href="#design" data-i18n="admin.tile.design" data-i18n-title="tip.tile.design"></a>
      <a href="#photos" data-i18n="admin.tile.photos" data-i18n-title="tip.tile.photos"></a>
      <a href="#pages" data-i18n="admin.tile.website" data-i18n-title="tip.tile.pages"></a>
      <h3 data-i18n="admin.group.planning"></h3>
      <a href="#guests" data-i18n="admin.tile.guests" data-i18n-title="tip.tile.guests"></a>
      <a href="#rsvp" data-i18n="admin.tile.rsvp" data-i18n-title="tip.tile.rsvp"></a>
      <a class="soon" aria-disabled="true" data-i18n-title="tip.soon"><span data-i18n="admin.tile.tables"></span> <em data-i18n="admin.soon"></em></a>
      <a class="soon" aria-disabled="true" data-i18n-title="tip.soon"><span data-i18n="admin.tile.drinks"></span> <em data-i18n="admin.soon"></em></a>
      <h3 data-i18n="admin.group.settings"></h3>
      <a href="#privacy" data-i18n="admin.tile.privacy" data-i18n-title="tip.tile.privacy"></a>
      <div class="drawer-foot"><b id="drawer-names"></b><small id="drawer-date"></small></div>
    </nav>

    <div id="panel-body">
      <section data-view="dashboard">
        <h1 id="brand"></h1>
        <div class="chips" id="chips"></div>
        <div class="tile-grid" id="tiles"></div>
      </section>

      <form data-view="details" id="details">
        <h2 data-i18n="admin.tile.details"></h2>
        <label for="names" data-i18n="admin.names"></label>
        <input id="names" maxlength="100">
        <div class="row">
          <div><label for="date" data-i18n="admin.date"></label><input id="date" type="date"></div>
          <div><label for="deadline" data-i18n="admin.deadline"></label><input id="deadline" type="date"></div>
        </div>
        <label for="location" data-i18n="admin.location"></label>
        <input id="location" maxlength="200">
        <label class="check"><input id="countdown" type="checkbox"> <span data-i18n="admin.countdown"></span></label>
        <label for="meals" data-i18n="admin.meals"></label>
        <input id="meals">
        <label data-i18n="admin.tagline"></label>
        <input id="tagline-en" maxlength="200" placeholder="English">
        <input id="tagline-es" maxlength="200" placeholder="Español">
        <input id="tagline-nl" maxlength="200" placeholder="Nederlands">
        <input id="tagline-mk" maxlength="200" placeholder="Македонски">
      </form>

      <form data-view="design" id="design">
        <h2 data-i18n="admin.tile.design"></h2>
        <h3 data-i18n="admin.templates"></h3>
        <div class="moods" id="moods" role="group"></div>
        <div class="templates" id="templates"></div>
        <h3 data-i18n="admin.customize"></h3>
        <p class="muted" data-i18n="admin.customizeText"></p>
        <label data-i18n="admin.color"></label>
        <div class="swatches" id="palettes"></div>
        <label for="font" data-i18n="admin.font"></label>
        <div class="fonts" id="fonts"></div>
        <label data-i18n="admin.layout"></label>
        <div class="layouts" id="layouts"></div>
        <label data-i18n="admin.art"></label>
        <div class="arts" id="arts"></div>
        <label data-i18n="admin.motion"></label>
        <div class="arts" id="motions"></div>
        <label for="accent" data-i18n="admin.accent"></label>
        <div class="row-inline">
          <input id="accent" type="color">
          <button type="button" class="link" id="accent-reset" data-i18n-title="tip.accentReset" data-i18n="admin.accentReset"></button>
        </div>
        <label style="margin-top:1.2rem" data-i18n="admin.cover"></label>
        <div class="gallery picker" id="cover-picker"></div>
        <label data-i18n="admin.photoShape"></label>
        <div class="arts" id="shapes"></div>
      </form>

      <form data-view="pages" id="page">
        <h2 data-i18n="admin.tile.website"></h2>
        <div class="row">
          <div><label for="slug" data-i18n="admin.page"></label><select id="slug"></select></div>
          <div><label for="lang" data-i18n="admin.language"></label><select id="lang"></select></div>
        </div>
        <label for="title" style="margin-top:1rem" data-i18n="admin.pageTitle"></label>
        <input id="title" maxlength="100">
        <label for="body" data-i18n="admin.pageBody"></label>
        <textarea id="body" rows="12" maxlength="20000"></textarea>
        <label data-i18n="admin.pagePhoto"></label>
        <div class="gallery picker" id="page-photo-picker"></div>
      </form>

      <section data-view="photos">
        <h2 data-i18n="admin.tile.photos"></h2>
        <p class="muted" data-i18n="admin.photosPrivate"></p>
        <label class="dropzone" id="dropzone" for="photo-files">
          <b data-i18n="admin.dropTitle"></b>
          <span data-i18n="admin.dropText"></span>
          <input id="photo-files" type="file" accept="image/*" multiple>
        </label>
        <p class="status" id="photo-status" role="status"></p>
        <div class="library" id="photos"></div>
      </section>

      <section data-view="guests">
        <h2 data-i18n="admin.tile.guests"></h2>
        <div class="guest-tools">
          <input type="search" id="guest-search" data-i18n-placeholder="admin.search" data-i18n-title="tip.search">
          <select id="guest-filter" data-i18n-title="tip.filter">
            <option value="all" data-i18n="admin.filter.all"></option>
            <option value="yes" data-i18n="admin.stat.attending"></option>
            <option value="no" data-i18n="admin.stat.declined"></option>
            <option value="none" data-i18n="admin.stat.noReply"></option>
          </select>
          <button type="button" class="ghost" id="csv-export" data-i18n="admin.csvExport" data-i18n-title="tip.csvExport"></button>
          <button type="button" id="invite-open" data-i18n="admin.invite.open" data-i18n-title="tip.invite"></button>
          <label class="btn ghost" for="csv-file" data-i18n-title="tip.csvImport"><span data-i18n="admin.csvImport"></span><input type="file" id="csv-file" accept=".csv,text/csv" hidden></label>
        </div>
        <p class="muted small" data-i18n="admin.csvHelp"></p>
        <div class="signup-panel">
          <label class="check"><input type="checkbox" id="signup-on"> <b data-i18n="admin.signup.on"></b></label>
          <p class="muted small" data-i18n="admin.signup.text"></p>
          <div class="row-inline">
            <code id="signup-url"></code>
            <button type="button" class="ghost" id="signup-copy" data-i18n="admin.signup.copy" data-i18n-title="tip.copy"></button>
            <button type="button" class="ghost" id="signup-renew" data-i18n="admin.signup.renew" data-i18n-title="tip.signupRenew"></button>
          </div>
        </div>
        <p class="status" id="guest-status" role="status"></p>
        <div class="table-wrap">
          <table class="guest-table">
            <thead><tr>
              <th data-i18n="admin.col.name"></th><th data-i18n="admin.col.group"></th><th data-i18n="admin.col.email"></th>
              <th data-i18n="admin.col.invite"></th><th data-i18n="admin.col.rsvp"></th><th data-i18n="admin.col.meal"></th><th data-i18n="admin.col.dietary"></th>
            </tr></thead>
            <tbody id="guest-rows"></tbody>
          </table>
        </div>
        <form id="add-party" style="margin-top:1.5rem">
          <label for="party-names" data-i18n="admin.partyNames"></label>
          <textarea id="party-names" rows="3" required></textarea>
          <p class="status" role="status"></p>
          <button type="submit" data-i18n="admin.add" data-i18n-title="tip.add"></button>
        </form>
      </section>

      <section data-view="rsvp">
        <h2 data-i18n="admin.tile.rsvp"></h2>
        <div class="stats" id="stats"></div>
        <div class="meal-counts" id="meal-counts"></div>
        <div id="answers"></div>
      </section>

      <form data-view="privacy" id="privacy">
        <h2 data-i18n="admin.tile.privacy"></h2>
        <p data-i18n="admin.privacyText"></p>
        <p class="muted" id="pw-state"></p>
        <label for="password" data-i18n="admin.guestPassword"></label>
        <input id="password" type="text" minlength="6" autocomplete="off">
      </form>
    </div>

    <footer id="savebar" hidden>
      <span id="savestate" role="status"></span>
      <button type="button" class="ghost" id="cancel" data-i18n-title="tip.cancel" data-i18n="admin.cancel"></button>
      <button type="submit" id="save" data-i18n-title="tip.save" data-i18n="admin.save"></button>
    </footer>
  </aside>

  <section id="stage">
    <div class="stage-bar">
      <select id="preview-page" data-i18n-title="tip.previewPage"></select>
      <span class="devices">
        <button type="button" id="dev-desktop" aria-pressed="true" data-i18n-title="tip.desktop">&#128421;</button>
        <button type="button" id="dev-mobile" aria-pressed="false" data-i18n-title="tip.mobile">&#128241;</button>
      </span>
      <span class="published">
        <i class="dot"></i><span data-i18n="admin.published"></span> <b id="host"></b>
        <button type="button" class="link" id="copy" data-i18n-title="tip.copy" data-i18n="admin.share"></button>
        <a id="open-site" data-i18n-title="tip.openSite" href="/home" target="_blank" rel="noopener" data-i18n="admin.openSite"></a>
      </span>
      <span class="who">
        <select class="lang" data-i18n-title="tip.lang"></select>
        <button type="button" class="link" id="logout" data-i18n-title="tip.logout" data-i18n="nav.logout"></button>
      </span>
    </div>
    <div id="device"><iframe id="preview" title="Preview"></iframe></div>
  </section>
  <dialog class="focus" id="focus-dialog">
    <h2 data-i18n="admin.focusTitle"></h2>
    <p class="muted" data-i18n="admin.focusText"></p>
    <div class="focus-stage" id="focus-stage" tabindex="0"><img id="focus-img" alt=""><i id="focus-dot"></i></div>
    <div class="focus-previews" id="focus-previews"></div>
    <div class="focus-actions">
      <button type="button" class="ghost" id="focus-cancel" data-i18n="admin.cancel"></button>
      <button type="button" id="focus-save" data-i18n="admin.save"></button>
    </div>
  </dialog>
  <dialog class="focus guest" id="guest-dialog">
    <form id="guest-form">
      <h2 id="guest-title"></h2>
      <label for="g-name" data-i18n="admin.col.name"></label>
      <input id="g-name" maxlength="100" required>
      <label for="g-email" data-i18n="admin.col.email"></label>
      <input id="g-email" type="email" maxlength="200">
      <label for="g-rsvp" data-i18n="admin.col.rsvp"></label>
      <select id="g-rsvp">
        <option value="none" data-i18n="admin.stat.noReply"></option>
        <option value="yes" data-i18n="admin.stat.attending"></option>
        <option value="no" data-i18n="admin.stat.declined"></option>
      </select>
      <div class="row" id="g-yes">
        <div><label for="g-meal" data-i18n="admin.col.meal"></label><input id="g-meal" maxlength="60" list="g-meals"><datalist id="g-meals"></datalist></div>
        <div><label for="g-dietary" data-i18n="admin.col.dietary"></label><input id="g-dietary" maxlength="300"></div>
      </div>
      <p class="muted" id="g-group"></p>
      <p class="muted" id="g-note"></p>
      <div class="row-inline">
        <input id="g-add" maxlength="100" data-i18n-placeholder="admin.addToGroup">
        <button type="button" class="ghost" id="g-add-btn" data-i18n="admin.add" data-i18n-title="tip.addToGroup"></button>
      </div>
      <p class="status" id="g-status" role="status"></p>
      <div class="focus-actions">
        <button type="button" class="link danger" id="g-delete" data-i18n="admin.deleteGuest"></button>
        <span class="spacer"></span>
        <button type="button" class="ghost" id="g-cancel" data-i18n="admin.cancel"></button>
        <button type="submit" id="g-save" data-i18n="admin.save"></button>
      </div>
    </form>
  </dialog>
  <dialog class="focus guest" id="invite-dialog">
    <form id="invite-form">
      <h2 data-i18n="admin.invite.title"></h2>
      <label for="i-kind" data-i18n="admin.kind"></label>
      <select id="i-kind">
        <option value="savedate" data-i18n="admin.kind.savedate"></option>
        <option value="invitation" selected data-i18n="admin.kind.invitation"></option>
        <option value="thanks" data-i18n="admin.kind.thanks"></option>
      </select>
      <p class="setup" id="invite-setup" hidden data-i18n="admin.invite.setup"></p>
      <p class="muted small" id="invite-tracking" hidden data-i18n="admin.invite.noTracking"></p>
      <label for="i-from" data-i18n="admin.invite.from"></label>
      <input id="i-from" maxlength="200" required placeholder="Ana &amp; Marko &lt;hello@your-domain.com&gt;">
      <label for="i-reply" data-i18n="admin.invite.replyTo"></label>
      <input id="i-reply" type="email" maxlength="200">
      <label for="i-subject" data-i18n="admin.invite.subject"></label>
      <input id="i-subject" maxlength="150" required>
      <label for="i-message" data-i18n="admin.invite.message"></label>
      <textarea id="i-message" rows="5" maxlength="5000" required></textarea>
      <label for="i-button" data-i18n="admin.invite.button"></label>
      <input id="i-button" maxlength="60">
      <label for="i-who" data-i18n="admin.invite.who"></label>
      <select id="i-who">
        <option value="new" data-i18n="admin.invite.whoNew"></option>
        <option value="attending" data-i18n="admin.invite.whoAttending"></option>
        <option value="all" data-i18n="admin.invite.whoAll"></option>
        <option value="shown" data-i18n="admin.invite.whoShown"></option>
      </select>
      <p class="muted small" id="i-count"></p>
      <div class="row-inline">
        <input id="i-test" type="email" maxlength="200" data-i18n-placeholder="admin.invite.testTo">
        <button type="button" class="ghost" id="i-test-btn" data-i18n="admin.invite.test" data-i18n-title="tip.inviteTest"></button>
      </div>
      <p class="status" id="i-status" role="status"></p>
      <div class="focus-actions">
        <button type="button" class="ghost" id="i-cancel" data-i18n="admin.cancel"></button>
        <button type="submit" id="i-send" data-i18n="admin.invite.send"></button>
      </div>
    </form>
  </dialog>
  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
