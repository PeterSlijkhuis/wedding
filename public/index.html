<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wedding</title>
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <div class="hero">
    <header><select class="lang" aria-label="Language"></select></header>
    <div class="center">
      <h1 id="names"></h1>
      <div class="date" id="date"></div>
      <p class="tagline" id="tagline"></p>
      <a class="btn" href="/home" data-i18n="landing.enter"></a>
    </div>
  </div>
  <script type="module">
    import { init, t, formatDate } from "/js/app.js";
    const site = await init();
    document.getElementById("names").textContent = site.names;
    document.getElementById("date").textContent = formatDate(site.date);
    document.getElementById("tagline").textContent = site.tagline || t("home.welcome");
  </script>
</body>
</html>
