<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wedding</title>
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <header></header>
  <main>
    <h1 id="names"></h1>
    <p class="muted" style="text-align:center" id="date"></p>
    <p style="text-align:center" data-i18n="home.hello"></p>
    <div class="tiles" id="tiles"></div>
  </main>
  <script type="module">
    import { init, get, el, t, formatDate, guestHeader, pageHref } from "/js/app.js";
    const site = await init();
    await guestHeader();
    document.getElementById("names").textContent = site.names;
    document.getElementById("date").textContent = formatDate(site.date);
    const { pages } = await get("/api/nav");
    document.getElementById("tiles").replaceChildren(
      ...pages.map((s) => el("a", { href: pageHref(s) }, t(`page.${s}`))),
      el("a", { href: "/rsvp" }, t("nav.rsvp")));
  </script>
</body>
</html>
