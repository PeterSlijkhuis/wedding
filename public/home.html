<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wedding</title>
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <header></header>
  <main>
    <div class="home-hero">
      <img class="cover" id="cover" alt="" hidden>
      <img class="sprig-small" src="/img/sprig.svg" alt="">
      <div class="date" id="date"></div>
      <div class="location" id="location"></div>
      <div class="countdown" id="countdown"></div>
      <p class="muted" id="deadline"></p>
      <p id="hello" data-i18n="home.hello"></p>
      <button type="button" id="reopen" hidden data-i18n="home.message"></button>
    </div>
    <div class="tiles" id="tiles"></div>
  </main>

  <dialog class="sheet" id="message">
    <button type="button" class="close" id="msg-close" aria-label="Close">&times;</button>
    <h2 id="msg-title"></h2>
    <img class="sprig-small" src="/img/sprig.svg" alt="">
    <div id="msg-body"></div>
    <div class="actions"><button type="button" id="msg-continue" data-i18n="home.continue"></button></div>
  </dialog>

  <script type="module">
    import { init, get, el, t, formatDate, daysUntil, guestHeader, pageHref, paragraphs } from "/js/app.js";
    const site = await init();
    await guestHeader(site);
    const $ = (id) => document.getElementById(id);

    $("date").textContent = formatDate(site.date);
    $("location").textContent = site.location;
    const days = site.countdown ? daysUntil(site.date) : null;
    if (days) $("countdown").textContent = `${days} ${t("home.countdown")}`;
    if (site.rsvpDeadline) $("deadline").textContent = `${t("rsvp.deadline")} ${formatDate(site.rsvpDeadline)}`;
    if (site.coverPhoto) {
      $("cover").src = `/api/photos/${site.coverPhoto}`;
      $("cover").onload = () => { $("cover").hidden = false; };
    }

    const { pages } = await get("/api/nav");
    $("tiles").replaceChildren(
      ...pages.map((s) => el("a", { href: pageHref(s) }, t(`page.${s}`))),
      el("a", { href: "/rsvp" }, t("nav.rsvp")));

    // "Message from the couple": every language that has text, the visitor's own first. Shown once per visit.
    const lang = document.documentElement.lang;
    const { pages: messages } = await get("/api/pages?slug=welcome&all=1");
    messages.sort((a, b) => (b.lang === lang) - (a.lang === lang));
    if (messages.length) {
      $("hello").hidden = true;
      $("msg-title").textContent = messages.map((m) => m.title).filter(Boolean).join(" / ") || t("home.message");
      $("msg-body").replaceChildren(...messages.flatMap((m) => paragraphs(m.body)));
      const dialog = $("message");
      dialog.onclick = (e) => { if (e.target === dialog) dialog.close(); };
      $("msg-close").onclick = $("msg-continue").onclick = () => dialog.close();
      $("reopen").hidden = false;
      $("reopen").onclick = () => dialog.showModal();
      let seen = null;
      try { seen = sessionStorage.getItem("messageSeen"); } catch (err) { console.warn("sessionStorage unavailable", err); }
      if (!seen) {
        dialog.showModal();
        try { sessionStorage.setItem("messageSeen", "1"); } catch (err) { console.warn("sessionStorage unavailable", err); }
      }
    }
  </script>
</body>
</html>
