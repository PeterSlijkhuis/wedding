<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wedding</title>
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <header></header>
  <main>
    <h1 id="names"></h1>
    <p class="muted" style="text-align:center" id="date"></p>
    <div style="text-align:center" id="welcome"></div>
    <p class="muted" style="text-align:center" id="deadline"></p>
    <div class="tiles" id="tiles"></div>
  </main>
  <script type="module">
    import { init, get, el, t, formatDate, guestHeader, pageHref, paragraphs } from "/js/app.js";
    const site = await init();
    await guestHeader();
    document.getElementById("names").textContent = site.names;
    document.getElementById("date").textContent = formatDate(site.date);
    const welcome = await get(`/api/pages?slug=welcome&lang=${document.documentElement.lang}`);
    document.getElementById("welcome").replaceChildren(...(welcome.body ? paragraphs(welcome.body) : [el("p", {}, t("home.hello"))]));
    if (site.rsvpDeadline) document.getElementById("deadline").textContent = `${t("rsvp.deadline")} ${formatDate(site.rsvpDeadline)}`;
    const { pages } = await get("/api/nav");
    document.getElementById("tiles").replaceChildren(
      ...pages.map((s) => el("a", { href: pageHref(s) }, t(`page.${s}`))),
      el("a", { href: "/rsvp" }, t("nav.rsvp")));
  </script>
</body>
</html>
